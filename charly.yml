cachyos-extras:
    candy:
        description: |
            Installs the CachyOS host-parity workstation toolset — pacman/AUR helpers, diagnostic monitors, editors, tunnels, and desktop-integration packages.
            The remaining host workstation tools not already covered by the charly dev
            stack — the CLI/diagnostic/app gap from the CachyOS netinstall + the
            operator's manual installs, reverse-resolved to top-level packages.
            Excludes host-hardware/boot/firmware/network entries by design. accounts
            service is here because SDDM/Plasma user management needs it. Every entry
            lands as a real pacman repo or AUR package, so each tool's binary and
            package identity is independently verifiable on the built image.
        require:
            - '@github.com/opencharly/layer-yay:v2026.272.0425'
        distro:
            arch:
                package:
                    # System / pacman tooling
                    - pacman-contrib
                    - pkgfile
                    - rebuild-detector
                    - paru
                    - plocate
                    # Diagnostics / monitors
                    - btop
                    - duf
                    - glances
                    - pv
                    # Editors / terminal / apps (host parity)
                    - micro
                    - nano
                    - nano-syntax-highlighting
                    - vim
                    - alacritty
                    - meld
                    - firefox
                    # Net / fs / mail
                    - inetutils
                    - nfs-utils
                    - syncthing
                    - s-nail
                    - unrar
                    # Desktop integration helpers
                    - accountsservice
                    - xdg-user-dirs
                    - xdg-utils
                    - python-defusedxml
                    - python-packaging
                aur:
                    package:
                        - cloudflared-bin
                        - gvisor-tap-vsock
        plan:
            - check: the btop resource monitor binary is present
              file:
                file: /usr/bin/btop
                exists: true
            - check: the duf disk-usage viewer binary is present
              file:
                file: /usr/bin/duf
                exists: true
            - check: the paru AUR helper binary is present
              file:
                file: /usr/bin/paru
                exists: true
            - check: the cloudflared-bin AUR tunnel client resolves on PATH
              exit_status: 0
              command: command -v cloudflared
            - check: the syncthing file-synchronisation daemon binary is present
              file:
                file: /usr/bin/syncthing
                exists: true
            - check: package=accountsservice
              id: accountsservice-installed
              package:
                package: accountsservice
                installed: true

cachyos-extras-skill:
    skill:
        name: cachyos-extras
        family: distros
        owner: cachyos-extras
        description: |-
            The CachyOS host-parity workstation toolset candy — pacman/AUR helpers,
            diagnostic monitors, editors, tunnels, and desktop-integration packages.
            Use when composing the CachyOS host workstation profile or adding the
            host toolset to an image.
        content: |
            # cachyos-extras — the CachyOS host-parity workstation toolset

            ## Candy Properties

            | Property | Value |
            |----------|-------|
            | Distro | Arch/CachyOS (`pac` + AUR) |
            | Requires | `@github.com/opencharly/layer-yay` (AUR helper) |
            | Scope | host workstation tools (no hardware/boot/firmware/network) |

            ## What it installs

            The CachyOS netinstall + manual-install gap, reverse-resolved to top-level
            packages: system/pacman tooling (`pacman-contrib`, `pkgfile`,
            `rebuild-detector`, `paru`, `plocate`), diagnostics/monitors (`btop`,
            `duf`, `glances`, `pv`), editors/terminal/apps (`micro`, `nano` + syntax,
            `vim`, `alacritty`, `meld`, `firefox`), net/fs/mail (`inetutils`,
            `nfs-utils`, `syncthing`, `s-nail`, `unrar`), desktop-integration
            (`accountsservice`, `xdg-user-dirs`, `xdg-utils`, `python-defusedxml`,
            `python-packaging`), and AUR (`cloudflared-bin`, `gvisor-tap-vsock`).
            Host-hardware/boot/firmware/network entries are excluded by design.

            ## Usage

            Compose it in a CachyOS workstation box:

            ```yaml
            cachyos-workstation:
              candy:
                base: cachyos-base
                candy:
                  - '@github.com/opencharly/layer-cachyos-extras:v2026.xxx.yyyy'
            ```

            ## Verification

            `plan:` `check:` steps assert the headline binaries resolve on the built
            image (`/usr/bin/btop`, `/usr/bin/duf`, `/usr/bin/paru`, `command -v
            cloudflared`, `/usr/bin/syncthing`) and that `accountsservice` is installed.

            ## Related

            - `/charly-distros:cachyos` — the CachyOS base
            - `/charly-tools:yay` — the AUR helper this candy requires
            - `/charly-local:charly-cachyos` — the operator workstation profile

cachyos-base-check:
    candy:
        description: |
            CachyOS base-image verification layer: proves the pacman scriptlet network
            sandbox is disabled (so install scriptlets and hooks actually run in rootless
            build containers), the image is CachyOS, pacman is present, and the cachyos-v3
            repo is configured. Composed by the cachyos base box so every CachyOS-derived
            image bakes these checks into its ai.opencharly.description plan and they run
            in `charly check box` / `charly check live` — a base-box plan alone would NOT
            bake into derived images, leaving the headline sandbox gate unexecuted in the
            beds that ship the fix.
        # The checks verify pacman's configuration, so the candy declares pacman itself as
        # its install content (a no-op on the base, which already ships it) — this is the
        # honest content that makes the candy a valid ADE entity (a check-only candy with
        # no install and no composition is rejected by validateCandyContents).
        distro:
            arch:
                package:
                    - pacman
        # CachyOS's pacman is a -4 REBUILD of the same 7.1.0.r9.g54d9411 version Arch
        # ships as -2, and it carries a scriptlet network-isolation patch Arch's does
        # not (proven by extracting both libalpm: 2,025,008 B vs 281,240 B, and by the
        # -4 binary alone carrying the strings "could not isolate the network" and
        # "refusing to run %s with network access"). It runs every install scriptlet and
        # hook inside a fresh network namespace and ABORTS THE SCRIPTLET ENTIRELY when
        # that namespace cannot be created — which is exactly the case in a rootless
        # build container, where unshare(CLONE_NEWNET) returns EPERM.
        #
        # The cost was silent and large: 46-51 scriptlets and hooks never ran in ANY
        # shipped CachyOS image — ldconfig (no linker cache), systemd-hook x34-37 (no
        # unit presets), update-ca-trust (CA store not rebuilt), locale-gen, fc-cache,
        # iconvconfig, and nvidia-ctk-cdi (no CDI spec on the GPU boxes). pacman treats
        # a refused hook as non-fatal, so the build "succeeded" every time.
        #
        # pacman.conf(5), shipped inside this very image, names this option as the
        # supported fix for "unprivileged containers lacking CAP_SYS_ADMIN". It is
        # strictly NARROWER than the DisableSandboxFilesystem that Arch's own container
        # image ships, and it leaves the download sandbox intact.
        #
        # The DIRECTIVE lives in the cachyos base box's pac install, not the shared `pac`
        # install_template: cachyos inherits arch, and Arch's -2 pacman does not recognise
        # the directive — it would emit "directive not recognized" on every Arch build.
        # This CHECK is cachyos-specific and lives HERE, on a candy the base box composes,
        # so it bakes into every CachyOS-derived image (a base-box plan does not).
        plan:
            - check: pacman's scriptlet network sandbox is disabled, so install scriptlets and hooks actually run instead of being refused
              id: cachyos-pacman-sandbox-disabled
              exit_status: 0
              stdout:
                - contains: DisableSandboxNetwork
              command: grep '^DisableSandboxNetwork' /etc/pacman.conf
            - check: command=cat /etc/os-release
              id: cachyos-os-release
              exit_status: 0
              stdout:
                - contains: "ID=cachyos"
              command: cat /etc/os-release
            - check: command=pacman --version
              id: cachyos-pacman
              exit_status: 0
              stdout:
                - contains: "Pacman v"
              command: pacman --version
            - check: command=pacman-conf --repo-list
              id: cachyos-v3-repo-configured
              exit_status: 0
              stdout:
                - contains: "cachyos-v3"
              command: pacman-conf --repo-list
