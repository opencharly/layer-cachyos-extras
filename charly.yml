cachyos-extras:
    candy:
        description: |
            Installs the CachyOS host-parity workstation toolset — pacman/AUR helpers, diagnostic monitors, editors, tunnels, and desktop-integration packages.
            The remaining host workstation tools not already covered by the charly dev
            stack — the CLI/diagnostic/app gap from the CachyOS netinstall + the
            operator's manual installs, reverse-resolved to top-level packages.
            Excludes host-hardware/boot/firmware/network entries by design. accounts
            service is here because SDDM/Plasma user management needs it. Every entry
            lands as a real pacman repo or AUR package, so each tool's binary and
            package identity is independently verifiable on the built image.
        require:
            - '@github.com/opencharly/layer-yay:v2026.272.0425'
        distro:
            arch:
                package:
                    # System / pacman tooling
                    - pacman-contrib
                    - pkgfile
                    - rebuild-detector
                    - paru
                    - plocate
                    # Diagnostics / monitors
                    - btop
                    - duf
                    - glances
                    - pv
                    # Editors / terminal / apps (host parity)
                    - micro
                    - nano
                    - nano-syntax-highlighting
                    - vim
                    - alacritty
                    - meld
                    - firefox
                    # Net / fs / mail
                    - inetutils
                    - nfs-utils
                    - syncthing
                    - s-nail
                    - unrar
                    # Desktop integration helpers
                    - accountsservice
                    - xdg-user-dirs
                    - xdg-utils
                    - python-defusedxml
                    - python-packaging
                aur:
                    package:
                        - cloudflared-bin
                        - gvisor-tap-vsock
        plan:
            - check: the btop resource monitor binary is present
              file:
                file: /usr/bin/btop
                exists: true
            - check: the duf disk-usage viewer binary is present
              file:
                file: /usr/bin/duf
                exists: true
            - check: the paru AUR helper binary is present
              file:
                file: /usr/bin/paru
                exists: true
            - check: the cloudflared-bin AUR tunnel client resolves on PATH
              exit_status: 0
              command: command -v cloudflared
            - check: the syncthing file-synchronisation daemon binary is present
              file:
                file: /usr/bin/syncthing
                exists: true
            - check: package=accountsservice
              id: accountsservice-installed
              package:
                package: accountsservice
                installed: true

cachyos-extras-skill:
    skill:
        name: cachyos-extras
        family: distros
        owner: cachyos-extras
        description: |-
            The CachyOS host-parity workstation toolset candy — pacman/AUR helpers,
            diagnostic monitors, editors, tunnels, and desktop-integration packages.
            Use when composing the CachyOS host workstation profile or adding the
            host toolset to an image.
        content: |
            # cachyos-extras — the CachyOS host-parity workstation toolset

            ## Candy Properties

            | Property | Value |
            |----------|-------|
            | Distro | Arch/CachyOS (`pac` + AUR) |
            | Requires | `@github.com/opencharly/layer-yay` (AUR helper) |
            | Scope | host workstation tools (no hardware/boot/firmware/network) |

            ## What it installs

            The CachyOS netinstall + manual-install gap, reverse-resolved to top-level
            packages: system/pacman tooling (`pacman-contrib`, `pkgfile`,
            `rebuild-detector`, `paru`, `plocate`), diagnostics/monitors (`btop`,
            `duf`, `glances`, `pv`), editors/terminal/apps (`micro`, `nano` + syntax,
            `vim`, `alacritty`, `meld`, `firefox`), net/fs/mail (`inetutils`,
            `nfs-utils`, `syncthing`, `s-nail`, `unrar`), desktop-integration
            (`accountsservice`, `xdg-user-dirs`, `xdg-utils`, `python-defusedxml`,
            `python-packaging`), and AUR (`cloudflared-bin`, `gvisor-tap-vsock`).
            Host-hardware/boot/firmware/network entries are excluded by design.

            ## Usage

            Compose it in a CachyOS workstation box:

            ```yaml
            cachyos-workstation:
              candy:
                base: cachyos-base
                candy:
                  - '@github.com/opencharly/layer-cachyos-extras:v2026.xxx.yyyy'
            ```

            ## Verification

            `plan:` `check:` steps assert the headline binaries resolve on the built
            image (`/usr/bin/btop`, `/usr/bin/duf`, `/usr/bin/paru`, `command -v
            cloudflared`, `/usr/bin/syncthing`) and that `accountsservice` is installed.

            ## Related

            - `/charly-distros:cachyos` — the CachyOS base
            - `/charly-tools:yay` — the AUR helper this candy requires
            - `/charly-local:charly-cachyos` — the operator workstation profile
